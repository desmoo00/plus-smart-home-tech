server:
  port: 0

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
          server:
            native:
              search-locations:
                - classpath:/config/telemetry/{application}
                - classpath:/config/commerce/{application}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${random.uuid}
